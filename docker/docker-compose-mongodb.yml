version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:6.0
    container_name: temporal-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=temporal
      - MONGO_INITDB_ROOT_PASSWORD=temporal123
      - MONGO_INITDB_DATABASE=temporal
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - temporal-network

  # Temporal server with MongoDB
  temporal:
    image: temporalio/auto-setup:latest
    container_name: temporal-server
    restart: unless-stopped
    environment:
      # Database configuration
      - DB=mongodb
      - MONGODB_SEEDS=mongodb:27017
      - MONGODB_USER=temporal
      - MONGODB_PWD=temporal123
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      
      # Connection pool settings
      - MONGODB_MAX_POOL_SIZE=20
      - MONGODB_MIN_POOL_SIZE=5
      - MONGODB_MAX_CONN_IDLE_TIME=1h
      - MONGODB_VIS_MAX_POOL_SIZE=10
      - MONGODB_VIS_MIN_POOL_SIZE=2
      
      # MongoDB-specific settings
      - MONGODB_WRITE_CONCERN=majority
      - MONGODB_READ_CONCERN=majority
      - MONGODB_READ_PREFERENCE=primary
      
      # Temporal server settings
      - TEMPORAL_BROADCAST_ADDRESS=127.0.0.1
      - BIND_ON_IP=0.0.0.0
      - FRONTEND_GRPC_PORT=7233
      - FRONTEND_HTTP_PORT=7243
      
      # Logging
      - LOG_LEVEL=info
    ports:
      - "7233:7233"  # gRPC
      - "7243:7243"  # HTTP
    depends_on:
      - mongodb
    networks:
      - temporal-network

  # Temporal Web UI (optional)
  temporal-web:
    image: temporalio/web:latest
    container_name: temporal-web
    restart: unless-stopped
    environment:
      - TEMPORAL_GRPC_ENDPOINT=temporal:7233
      - TEMPORAL_PERMIT_WRITE_API=true
    ports:
      - "8088:8088"
    depends_on:
      - temporal
    networks:
      - temporal-network

volumes:
  mongodb_data:
    driver: local

networks:
  temporal-network:
    driver: bridge 